name: Surveillance Options RBC

on:
  schedule:
    # Exécution du lundi au vendredi à 10h30 et 14h30 (heures de Montréal / Toronto)
    # 14h30 UTC = 10h30 HAE / 18h30 UTC = 14h30 HAE
    - cron: '30 14,18 * * 1-5'
  workflow_dispatch: # Bouton d'exécution manuelle

jobs:
  check-options:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter la surveillance
        env:
          NTFY_COV: ${{ secrets.NTFY_COV }}
        run: python monitor.py
